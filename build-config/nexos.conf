# NexOS build configuration
# This file is sourced by scripts/lib/common.sh.
# Keep values shell-safe: KEY="value".

PROJECT_NAME="NexOS"
PROJECT_ID="nexos"
PROJECT_VERSION="0.4.0-part4"
PROJECT_CODENAME="Origin"

# Base distro selection.
# Debian 13 Trixie is used for a stable, lightweight, live-build-first workflow.
BASE_VENDOR="debian"
BASE_CODENAME="trixie"
BASE_ARCH="amd64"
BASE_ARCHIVE_AREAS="main contrib non-free-firmware"

# Debian mirrors.
MIRROR_BOOTSTRAP="http://deb.debian.org/debian/"
MIRROR_BINARY="http://deb.debian.org/debian/"
MIRROR_SECURITY="http://security.debian.org/debian-security/"

# Live session defaults.
LIVE_USERNAME="nexos"
LIVE_HOSTNAME="nexos-live"
LIVE_FULLNAME="NexOS Live User"
LIVE_LOCALE="en_US.UTF-8"
LIVE_KEYBOARD="us"
LIVE_TIMEZONE="America/Denver"
LIVE_USER_GROUPS="audio cdrom dip floppy video plugdev netdev powerdev scanner bluetooth sudo"

# ISO metadata.
ISO_VOLUME_ID="NexOS_Origin_amd64"
ISO_IMAGE_NAME="nexos-origin-amd64.iso"
ISO_APPLICATION="NexOS Live"
ISO_PUBLISHER="NexOS Project"
ISO_PREPARER="NexOS live-build scripts"

# Build resource expectations.
MIN_FREE_SPACE_GB="35"
RECOMMENDED_FREE_SPACE_GB="50"
MIN_RAM_MB="4096"
RECOMMENDED_RAM_MB="8192"

# VirtualBox defaults for testing.
VBOX_VM_NAME="NexOS-Test"
VBOX_OS_TYPE="Debian_64"
VBOX_RAM_MB="4096"
VBOX_CPUS="2"
VBOX_DISK_MB="40960"
VBOX_GRAPHICS="VMSVGA"
VBOX_VRAM_MB="128"
VBOX_FIRMWARE="efi"

# Part 3 VirtualBox test defaults.
VBOX_SNAPSHOT_NAME="Fresh-Live-ISO-Test"
VBOX_LOG_DIR="build/virtualbox"
VBOX_START_MODE="gui"
VBOX_SHARED_CLIPBOARD="bidirectional"
VBOX_DRAG_AND_DROP="bidirectional"
