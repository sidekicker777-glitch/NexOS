name: Build NexOS ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which NexOS ISO edition to build'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - tools
          - security
          - all
  push:
    branches:
      - main
      - master
    paths:
      - 'Makefile'
      - 'build-config/**'
      - 'live-build/**'
      - 'scripts/**'
      - 'testing/**'
      - '.github/workflows/build-nexos-iso.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-iso:
    name: Build bootable live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout NexOS source
        uses: actions/checkout@v4

      - name: Show runner disk space before build
        run: |
          df -h
          docker --version

      - name: Build ISO inside Debian Trixie container
        run: |
          mkdir -p build/logs iso
          EDITION="${{ github.event.inputs.edition || 'main' }}"

          docker run --privileged --rm \
            -v "$PWD:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            -e NEXOS_EDITION="$EDITION" \
            debian:trixie \
            bash -lc '
              set -Eeuxo pipefail

              mkdir -p build/logs iso

              apt-get update

              # Install only must-have runner packages as hard requirements.
              # Some Debian package names change or disappear between snapshots,
              # so optional boot/VM helpers are installed one-by-one below.
              apt-get install -y --no-install-recommends \
                bash ca-certificates coreutils curl file findutils git grep gzip \
                live-build debootstrap squashfs-tools xorriso isolinux \
                syslinux-common mtools parted rsync \
                make sed tar util-linux sudo

              install_optional_runner_pkg() {
                local pkg="$1"
                if apt-cache show "$pkg" >/dev/null 2>&1; then
                  apt-get install -y --no-install-recommends "$pkg" || true
                else
                  echo "Optional runner package not available: $pkg"
                fi
              }

              for pkg in syslinux-utils dosfstools; do
                install_optional_runner_pkg "$pkg"
              done

              # GitHub web uploads can remove Linux executable permissions.
              find scripts testing -type f -name "*.sh" -exec chmod +x {} +

              # Fail early with a clear log if a generated shell script has syntax problems.
              bash -n scripts/02-init-live-build.sh
              bash -n scripts/05-build-live-iso.sh
              bash -n scripts/10-inject-nexos-core-apps.sh
              bash -n scripts/11-inject-nexos-desktop-polish.sh
              bash -n scripts/12-inject-nexos-maintenance-tools.sh
              bash -n scripts/13-inject-nexos-dev-center.sh
              bash -n scripts/14-inject-nexos-install-center.sh
              bash -n scripts/15-inject-nexos-visual-polish.sh
              bash -n scripts/16-inject-nexos-branding-boot.sh
              bash -n scripts/17-inject-nexos-icons-fix.sh
              bash -n scripts/18-inject-nexos-desktop-layout.sh
              bash -n scripts/19-fix-nexos-package-lists.sh

              if [[ "$NEXOS_EDITION" == "all" ]]; then
                make iso-main 2>&1 | tee build/logs/github-actions-main-iso.log
                make validate-iso-main 2>&1 | tee build/logs/github-actions-main-validate.log
                make clean 2>&1 | tee build/logs/github-actions-clean-after-main.log || true

                make iso-tools 2>&1 | tee build/logs/github-actions-tools-iso.log
                make validate-iso-tools 2>&1 | tee build/logs/github-actions-tools-validate.log
                make clean 2>&1 | tee build/logs/github-actions-clean-after-tools.log || true

                make iso-security 2>&1 | tee build/logs/github-actions-security-iso.log
                make validate-iso-security 2>&1 | tee build/logs/github-actions-security-validate.log
              elif [[ "$NEXOS_EDITION" == "tools" ]]; then
                make iso-tools 2>&1 | tee build/logs/github-actions-tools-iso.log
                make validate-iso-tools 2>&1 | tee build/logs/github-actions-tools-validate.log
              elif [[ "$NEXOS_EDITION" == "security" ]]; then
                make iso-security 2>&1 | tee build/logs/github-actions-security-iso.log
                make validate-iso-security 2>&1 | tee build/logs/github-actions-security-validate.log
              else
                make iso-main 2>&1 | tee build/logs/github-actions-main-iso.log
                make validate-iso-main 2>&1 | tee build/logs/github-actions-main-validate.log
              fi

              ls -lh iso
            '

      - name: Show runner disk space after build
        if: always()
        run: df -h

      - name: Upload NexOS ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexOS-live-ISO
          path: |
            iso/*.iso
            iso/*.sha256
            build/logs/**
          if-no-files-found: warn
          retention-days: 14
