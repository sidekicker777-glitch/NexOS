name: Build NexOS ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which NexOS ISO edition to build'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - tools
          - security
          - all
  push:
    branches:
      - main
      - master
    paths:
      - 'Makefile'
      - 'build-config/**'
      - 'live-build/**'
      - 'scripts/**'
      - 'testing/**'
      - '.github/workflows/build-nexos-iso.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-iso:
    name: Build bootable live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout NexOS source
        uses: actions/checkout@v4

      - name: Show runner disk space before build
        run: |
          df -h
          docker --version

      - name: NexOS source preflight
        run: |
          mkdir -p build/logs iso
          EDITION="${{ github.event.inputs.edition || 'main' }}"
          set +e
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            -e NEXOS_EDITION="$EDITION" \
            debian:trixie \
            bash -lc '
              set -Euxo pipefail
              mkdir -p build/logs iso
              : > build/logs/github-actions-source-preflight.log
              apt-get update 2>&1 | tee -a build/logs/github-actions-source-preflight.log
              apt-get install -y --no-install-recommends bash ca-certificates coreutils findutils grep sed make python3 shellcheck jq 2>&1 | tee -a build/logs/github-actions-source-preflight.log
              find scripts -type f -name "*.sh" -exec chmod +x {} +
              if [[ -d testing ]]; then find testing -type f -name "*.sh" -exec chmod +x {} +; fi
              syntax_failed=0
              while IFS= read -r script; do
                bash -n "$script" 2>&1 | tee -a build/logs/github-actions-source-preflight.log || syntax_failed=1
              done < <(find scripts -type f -name "*.sh" | sort)
              wiring_failed=0
              if [[ -f scripts/19-fix-nexos-package-lists.sh ]]; then
                while IFS= read -r file; do
                  base="$(basename "$file")"
                  if ! grep -q "$base" scripts/19-fix-nexos-package-lists.sh; then
                    echo "Late injector not wired in safety pass: $base" | tee -a build/logs/github-actions-source-preflight.log
                    wiring_failed=1
                  fi
                done < <(find scripts -maxdepth 1 -type f -name '*-inject-nexos-*.sh' | awk -F/ '{print $NF}' | awk -F- '$1>=27 {print "scripts/"$0}' | sort -V)
              else
                echo "Missing package safety pass: scripts/19-fix-nexos-package-lists.sh" | tee -a build/logs/github-actions-source-preflight.log
                wiring_failed=1
              fi
              echo "syntax_failed=$syntax_failed wiring_failed=$wiring_failed" | tee -a build/logs/github-actions-source-preflight.log
              if [[ "$syntax_failed" != "0" || "$wiring_failed" != "0" ]]; then exit 12; fi
            '
          code=$?
          echo "$code" > build/logs/github-actions-source-preflight-exit-code.txt
          exit 0

      - name: Build ISO inside Debian Trixie container
        run: |
          mkdir -p build/logs iso
          EDITION="${{ github.event.inputs.edition || 'main' }}"
          preflight_code="0"
          if [[ -f build/logs/github-actions-source-preflight-exit-code.txt ]]; then preflight_code="$(cat build/logs/github-actions-source-preflight-exit-code.txt)"; fi
          if [[ "$preflight_code" != "0" ]]; then
            echo "Source preflight failed with exit code $preflight_code. Skipping ISO build." | tee build/logs/github-actions-build-skipped.log
            echo "$preflight_code" > build/logs/github-actions-exit-code.txt
            exit 0
          fi
          set +e
          docker run --privileged --rm \
            -v "$PWD:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            -e NEXOS_EDITION="$EDITION" \
            debian:trixie \
            bash -lc '
              set -Euxo pipefail
              mkdir -p build/logs iso
              : > build/logs/github-actions-preflight.log
              apt-get update 2>&1 | tee -a build/logs/github-actions-preflight.log
              apt-get install -y --no-install-recommends \
                bash ca-certificates coreutils curl file findutils git grep gzip \
                live-build debootstrap squashfs-tools xorriso make sed tar util-linux sudo \
                2>&1 | tee -a build/logs/github-actions-preflight.log
              install_optional_runner_pkg() {
                local pkg="$1"
                if apt-cache show "$pkg" >/dev/null 2>&1; then apt-get install -y --no-install-recommends "$pkg" 2>&1 | tee -a build/logs/github-actions-preflight.log || true; else echo "Optional runner package not available: $pkg" | tee -a build/logs/github-actions-preflight.log; fi
              }
              for pkg in isolinux syslinux-common syslinux-utils mtools parted rsync dosfstools shellcheck jq; do install_optional_runner_pkg "$pkg"; done
              if ! command -v lb >/dev/null 2>&1; then echo "ERROR: live-build command lb was not installed." | tee -a build/logs/github-actions-preflight.log; exit 2; fi
              find scripts -type f -name "*.sh" -exec chmod +x {} +
              if [[ -d testing ]]; then find testing -type f -name "*.sh" -exec chmod +x {} +; fi
              syntax_failed=0
              while IFS= read -r script; do bash -n "$script" 2>&1 | tee -a build/logs/github-actions-preflight.log || syntax_failed=1; done < <(find scripts -type f -name "*.sh" | sort)
              echo "syntax_failed=$syntax_failed" | tee -a build/logs/github-actions-preflight.log
              if [[ "$syntax_failed" != "0" ]]; then exit 13; fi
              if [[ -f scripts/19-fix-nexos-package-lists.sh ]]; then bash scripts/19-fix-nexos-package-lists.sh 2>&1 | tee build/logs/github-actions-package-safety.log; fi

              validation="build/logs/nexos-build-validation-report.txt"
              : > "$validation"
              {
                echo "NexOS Build Validation Report"
                echo "============================="
                date
                echo
                echo "Edition: $NEXOS_EDITION"
                echo
                echo "Late injectors wired in safety pass:"
                if [[ -f scripts/19-fix-nexos-package-lists.sh ]]; then
                  grep -E "^[[:space:]]+[0-9]+-inject-nexos-.*\.sh" scripts/19-fix-nexos-package-lists.sh | sed "s/^[[:space:]]*/- /" || true
                else
                  echo "- missing scripts/19-fix-nexos-package-lists.sh"
                fi
                echo
                echo "Injector files present:"
                find scripts -maxdepth 1 -type f -name "*-inject-nexos-*.sh" -printf "- %f\n" | sort -V || true
                echo
                echo "Generated package lists after safety pass:"
                find config/package-lists -maxdepth 1 -type f -name "*.list.chroot" -printf "- %f\n" | sort || true
                echo
                echo "Optional packages moved out of hard lists:"
                if [[ -f config/nexos-removed-optional-packages.txt ]]; then sed "s/^/- /" config/nexos-removed-optional-packages.txt; else echo "- none recorded"; fi
                echo
                echo "Generated normal hooks:"
                find config/hooks/normal -maxdepth 1 -type f -printf "- %f\n" | sort || true
                echo
                echo "Expected NexOS desktop apps from injectors:"
                grep -R "Name=NexOS" -n scripts/*inject-nexos-*.sh 2>/dev/null | sed "s/^/- /" | head -200 || true
                echo
                echo "Expected NexOS commands from injectors:"
                grep -R "cat > /usr/local/bin/nexos-" -n scripts/*inject-nexos-*.sh 2>/dev/null | sed "s/^/- /" | head -240 || true
              } | tee -a "$validation"

              smoke="build/logs/nexos-final-smoke-source-report.txt"
              : > "$smoke"
              {
                echo "NexOS Final Smoke Source Report"
                echo "==============================="
                date
                echo
                pass=0; warn=0; fail=0
                smoke_check(){ name="$1"; shift; if "$@" >/tmp/nexos-gh-smoke.out 2>&1; then echo "PASS: $name"; pass=$((pass+1)); else echo "FAIL: $name"; sed "s/^/  /" /tmp/nexos-gh-smoke.out; fail=$((fail+1)); fi; }
                smoke_soft(){ name="$1"; shift; if "$@" >/tmp/nexos-gh-smoke.out 2>&1; then echo "PASS: $name"; pass=$((pass+1)); else echo "WARN: $name"; sed "s/^/  /" /tmp/nexos-gh-smoke.out; warn=$((warn+1)); fi; }
                smoke_check "package safety script exists" test -f scripts/19-fix-nexos-package-lists.sh
                smoke_check "final smoke injector exists" test -f scripts/58-inject-nexos-final-smoke-test-pack.sh
                smoke_check "final smoke injector wired" grep -q "58-inject-nexos-final-smoke-test-pack.sh" scripts/19-fix-nexos-package-lists.sh
                smoke_check "desktop ux injector exists" test -f scripts/57-inject-nexos-desktop-ux-final-pass.sh
                smoke_check "app icon injector exists" test -f scripts/56-inject-nexos-app-icon-validation-fix-pass.sh
                smoke_soft "control panel injector exists" test -f scripts/51-inject-nexos-control-panel-unified.sh
                smoke_soft "security center injector exists" test -f scripts/48-inject-nexos-security-center-main.sh
                smoke_soft "network center injector exists" test -f scripts/49-inject-nexos-network-center-v2.sh
                smoke_soft "power center injector exists" test -f scripts/44-inject-nexos-power-center.sh
                smoke_soft "assistant catalog edits present" grep -R "app_catalog.json" -n scripts/*inject-nexos-*.sh
                smoke_soft "desktop apps generated by injectors" grep -R "Name=NexOS" -n scripts/*inject-nexos-*.sh
                smoke_soft "nexos command heredocs generated" grep -R "cat > /usr/local/bin/nexos-" -n scripts/*inject-nexos-*.sh
                smoke_soft "package lists generated" bash -lc "find config/package-lists -maxdepth 1 -name \"*.list.chroot\" | grep -q ."
                echo
                echo "Summary: PASS=$pass WARN=$warn FAIL=$fail"
                echo
                echo "Core late injectors:"
                find scripts -maxdepth 1 -type f -name "[4-5][0-9]-inject-nexos-*.sh" -printf "- %f\n" | sort -V || true
                rm -f /tmp/nexos-gh-smoke.out
                if [[ "$fail" -gt 0 ]]; then echo "Smoke source checks found failures."; fi
              } | tee -a "$smoke"

              set -e
              if [[ "$NEXOS_EDITION" == "all" ]]; then
                make iso-main 2>&1 | tee build/logs/github-actions-main-iso.log
                make validate-iso-main 2>&1 | tee build/logs/github-actions-main-validate.log
                make clean 2>&1 | tee build/logs/github-actions-clean-after-main.log || true
                make iso-tools 2>&1 | tee build/logs/github-actions-tools-iso.log
                make validate-iso-tools 2>&1 | tee build/logs/github-actions-tools-validate.log
                make clean 2>&1 | tee build/logs/github-actions-clean-after-tools.log || true
                make iso-security 2>&1 | tee build/logs/github-actions-security-iso.log
                make validate-iso-security 2>&1 | tee build/logs/github-actions-security-validate.log
              elif [[ "$NEXOS_EDITION" == "tools" ]]; then
                make iso-tools 2>&1 | tee build/logs/github-actions-tools-iso.log
                make validate-iso-tools 2>&1 | tee build/logs/github-actions-tools-validate.log
              elif [[ "$NEXOS_EDITION" == "security" ]]; then
                make iso-security 2>&1 | tee build/logs/github-actions-security-iso.log
                make validate-iso-security 2>&1 | tee build/logs/github-actions-security-validate.log
              else
                make iso-main 2>&1 | tee build/logs/github-actions-main-iso.log
                make validate-iso-main 2>&1 | tee build/logs/github-actions-main-validate.log
              fi
              ls -lh iso
            '
          code=$?
          echo "$code" > build/logs/github-actions-exit-code.txt
          exit 0

      - name: Print NexOS build error summary
        if: always()
        run: |
          mkdir -p build/logs
          code="0"
          if [[ -f build/logs/github-actions-exit-code.txt ]]; then code="$(cat build/logs/github-actions-exit-code.txt)"; elif [[ -f build/logs/github-actions-source-preflight-exit-code.txt ]]; then code="$(cat build/logs/github-actions-source-preflight-exit-code.txt)"; fi
          echo "## NexOS ISO build diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Available logs" >> "$GITHUB_STEP_SUMMARY"
          find build/logs -maxdepth 1 -type f -printf '- %f\n' 2>/dev/null | sort >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f build/logs/nexos-build-validation-report.txt ]]; then
            echo "### Build validation report preview" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            head -n 120 build/logs/nexos-build-validation-report.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f build/logs/nexos-final-smoke-source-report.txt ]]; then
            echo "### Final smoke source report preview" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            head -n 100 build/logs/nexos-final-smoke-source-report.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          combined="build/logs/github-actions-combined-tail.log"
          : > "$combined"
          for f in build/logs/*.log; do [[ -f "$f" ]] || continue; echo "===== $f =====" >> "$combined"; tail -n 220 "$f" >> "$combined" || true; echo >> "$combined"; done
          first_error="$(grep -iE 'error|failed|unable to locate|not found|syntax error|no such file|E: |conflict|missing package safety|not wired' "$combined" | head -n 1 || true)"
          if [[ -z "$first_error" ]]; then first_error="No obvious error marker found. Check build/logs artifact."; fi
          echo "### First detected error" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$first_error" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Last build log lines" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 160 "$combined" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$code" != "0" ]]; then echo "::error title=NexOS ISO build failed::$first_error"; exit "$code"; fi

      - name: Show runner disk space after build
        if: always()
        run: df -h

      - name: Upload NexOS ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexOS-live-ISO
          path: |
            iso/*.iso
            iso/*.sha256
            build/logs/**
          if-no-files-found: warn
          retention-days: 14
