name: Build NexOS ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which NexOS ISO edition to build'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - tools
          - security
          - all
  push:
    branches:
      - main
      - master
    paths:
      - 'Makefile'
      - 'build-config/**'
      - 'live-build/**'
      - 'scripts/**'
      - 'testing/**'
      - '.github/workflows/build-nexos-iso.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-iso:
    name: Build bootable live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout NexOS source
        uses: actions/checkout@v4

      - name: Show runner disk space before build
        run: |
          df -h
          docker --version

      - name: Build ISO inside Debian Trixie container
        run: |
          mkdir -p build/logs iso
          EDITION="${{ github.event.inputs.edition || 'main' }}"

          set +e
          docker run --privileged --rm \
            -v "$PWD:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            -e NEXOS_EDITION="$EDITION" \
            debian:trixie \
            bash -lc '
              set -Euxo pipefail

              mkdir -p build/logs iso
              : > build/logs/github-actions-preflight.log

              apt-get update 2>&1 | tee -a build/logs/github-actions-preflight.log

              apt-get install -y --no-install-recommends \
                bash ca-certificates coreutils curl file findutils git grep gzip \
                live-build debootstrap squashfs-tools xorriso \
                make sed tar util-linux sudo 2>&1 | tee -a build/logs/github-actions-preflight.log

              install_optional_runner_pkg() {
                local pkg="$1"
                if apt-cache show "$pkg" >/dev/null 2>&1; then
                  apt-get install -y --no-install-recommends "$pkg" 2>&1 | tee -a build/logs/github-actions-preflight.log || true
                else
                  echo "Optional runner package not available: $pkg" | tee -a build/logs/github-actions-preflight.log
                fi
              }

              for pkg in isolinux syslinux-common syslinux-utils mtools parted rsync dosfstools; do
                install_optional_runner_pkg "$pkg"
              done

              if ! command -v lb >/dev/null 2>&1; then
                echo "ERROR: live-build command lb was not installed." | tee -a build/logs/github-actions-preflight.log
                exit 2
              fi

              find scripts -type f -name "*.sh" -exec chmod +x {} +
              if [[ -d testing ]]; then
                find testing -type f -name "*.sh" -exec chmod +x {} +
              fi

              syntax_failed=0
              for script in \
                scripts/02-init-live-build.sh \
                scripts/05-build-live-iso.sh \
                scripts/10-inject-nexos-core-apps.sh \
                scripts/11-inject-nexos-desktop-polish.sh \
                scripts/12-inject-nexos-maintenance-tools.sh \
                scripts/13-inject-nexos-dev-center.sh \
                scripts/14-inject-nexos-install-center.sh \
                scripts/15-inject-nexos-visual-polish.sh \
                scripts/16-inject-nexos-branding-boot.sh \
                scripts/17-inject-nexos-icons-fix.sh \
                scripts/18-inject-nexos-desktop-layout.sh \
                scripts/19-fix-nexos-package-lists.sh; do
                if [[ -f "$script" ]]; then
                  bash -n "$script" 2>&1 | tee -a build/logs/github-actions-preflight.log || syntax_failed=1
                else
                  echo "Missing script: $script" | tee -a build/logs/github-actions-preflight.log
                  syntax_failed=1
                fi
              done
              echo "syntax_failed=$syntax_failed" | tee -a build/logs/github-actions-preflight.log

              set -e
              if [[ "$NEXOS_EDITION" == "all" ]]; then
                make iso-main 2>&1 | tee build/logs/github-actions-main-iso.log
                make validate-iso-main 2>&1 | tee build/logs/github-actions-main-validate.log
                make clean 2>&1 | tee build/logs/github-actions-clean-after-main.log || true

                make iso-tools 2>&1 | tee build/logs/github-actions-tools-iso.log
                make validate-iso-tools 2>&1 | tee build/logs/github-actions-tools-validate.log
                make clean 2>&1 | tee build/logs/github-actions-clean-after-tools.log || true

                make iso-security 2>&1 | tee build/logs/github-actions-security-iso.log
                make validate-iso-security 2>&1 | tee build/logs/github-actions-security-validate.log
              elif [[ "$NEXOS_EDITION" == "tools" ]]; then
                make iso-tools 2>&1 | tee build/logs/github-actions-tools-iso.log
                make validate-iso-tools 2>&1 | tee build/logs/github-actions-tools-validate.log
              elif [[ "$NEXOS_EDITION" == "security" ]]; then
                make iso-security 2>&1 | tee build/logs/github-actions-security-iso.log
                make validate-iso-security 2>&1 | tee build/logs/github-actions-security-validate.log
              else
                make iso-main 2>&1 | tee build/logs/github-actions-main-iso.log
                make validate-iso-main 2>&1 | tee build/logs/github-actions-main-validate.log
              fi

              ls -lh iso
            '
          code=$?
          echo "$code" > build/logs/github-actions-exit-code.txt
          exit 0

      - name: Print NexOS build error summary
        if: always()
        run: |
          mkdir -p build/logs
          code="0"
          if [[ -f build/logs/github-actions-exit-code.txt ]]; then
            code="$(cat build/logs/github-actions-exit-code.txt)"
          fi

          echo "## NexOS ISO build diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Available logs" >> "$GITHUB_STEP_SUMMARY"
          find build/logs -type f -maxdepth 1 -printf '- %f\n' 2>/dev/null | sort >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"

          combined="build/logs/github-actions-combined-tail.log"
          : > "$combined"
          for f in build/logs/*.log; do
            [[ -f "$f" ]] || continue
            echo "===== $f =====" >> "$combined"
            tail -n 180 "$f" >> "$combined" || true
            echo >> "$combined"
          done

          echo "### Last build log lines" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 140 "$combined" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [[ "$code" != "0" ]]; then
            first_error="$(grep -iE 'error|failed|unable to locate|not found|syntax error|no such file|E: ' "$combined" | head -n 1 || true)"
            if [[ -z "$first_error" ]]; then
              first_error="NexOS ISO build failed. Check build/logs/github-actions-combined-tail.log artifact."
            fi
            echo "::error title=NexOS ISO build failed::$first_error"
            exit "$code"
          fi

      - name: Show runner disk space after build
        if: always()
        run: df -h

      - name: Upload NexOS ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexOS-live-ISO
          path: |
            iso/*.iso
            iso/*.sha256
            build/logs/**
          if-no-files-found: warn
          retention-days: 14
