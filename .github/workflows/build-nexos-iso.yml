name: Build NexOS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Makefile'
      - 'build-config/**'
      - 'live-build/**'
      - 'scripts/**'
      - 'testing/**'
      - '.github/workflows/build-nexos-iso.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-iso:
    name: Build bootable live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout NexOS source
        uses: actions/checkout@v4

      - name: Show runner disk space before build
        run: |
          df -h
          docker --version

      - name: Build ISO inside Debian Trixie container
        run: |
          mkdir -p build/logs iso

          docker run --privileged --rm \
            -v "$PWD:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie \
            bash -lc '
              set -Eeuxo pipefail

              mkdir -p build/logs iso

              apt-get update

              apt-get install -y --no-install-recommends \
                bash ca-certificates coreutils curl file findutils git grep gzip \
                live-build debootstrap squashfs-tools xorriso isolinux \
                syslinux-common syslinux-utils dosfstools mtools parted rsync \
                make sed tar util-linux sudo

              # GitHub web uploads can remove Linux executable permissions.
              find scripts testing -type f -name "*.sh" -exec chmod +x {} +

              # Build the ISO directly. The ISO script regenerates live-build config itself,
              # so we do not run unrelated VirtualBox verification in this cloud build.
              make iso 2>&1 | tee build/logs/github-actions-make-iso.log
              make validate-iso 2>&1 | tee build/logs/github-actions-validate-iso.log

              ls -lh iso
            '

      - name: Show runner disk space after build
        if: always()
        run: df -h

      - name: Upload NexOS ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexOS-live-ISO
          path: |
            iso/*.iso
            iso/*.sha256
            build/logs/**
          if-no-files-found: warn
          retention-days: 14
