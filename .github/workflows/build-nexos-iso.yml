name: Build NexOS ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which NexOS ISO edition to build'
        required: true
        default: 'main'
        type: choice
        options: [main, tools, security, all]
  push:
    branches: [main, master]
    paths:
      - 'Makefile'
      - 'build-config/**'
      - 'live-build/**'
      - 'scripts/**'
      - 'testing/**'
      - '.github/workflows/build-nexos-iso.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-iso:
    name: Build bootable live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout NexOS source
        uses: actions/checkout@v4

      - name: Show runner disk space before build
        run: |
          df -h
          docker --version

      - name: NexOS source preflight
        run: |
          mkdir -p build/logs iso
          EDITION="${{ github.event.inputs.edition || 'main' }}"
          set +e
          docker run --rm -v "$PWD:/work" -w /work -e DEBIAN_FRONTEND=noninteractive -e NEXOS_EDITION="$EDITION" debian:trixie bash -lc '
            set -Euo pipefail
            mkdir -p build/logs iso
            : > build/logs/github-actions-source-preflight.log
            apt-get update 2>&1 | tee -a build/logs/github-actions-source-preflight.log
            apt-get install -y --no-install-recommends bash ca-certificates coreutils findutils grep sed make python3 shellcheck jq 2>&1 | tee -a build/logs/github-actions-source-preflight.log
            find scripts -type f -name "*.sh" -exec chmod +x {} +
            [[ ! -d testing ]] || find testing -type f -name "*.sh" -exec chmod +x {} +
            syntax_failed=0
            while IFS= read -r script; do
              bash -n "$script" 2>&1 | tee -a build/logs/github-actions-source-preflight.log || syntax_failed=1
            done < <(find scripts -type f -name "*.sh" | sort)
            wiring_failed=0
            if [[ -f scripts/19-fix-nexos-package-lists.sh ]]; then
              while IFS= read -r file; do
                base="$(basename "$file")"
                if ! grep -q "$base" scripts/19-fix-nexos-package-lists.sh; then
                  echo "Late injector not wired in safety pass: $base" | tee -a build/logs/github-actions-source-preflight.log
                  wiring_failed=1
                fi
              done < <(find scripts -maxdepth 1 -type f -name "*-inject-nexos-*.sh" | sort -V | while read -r f; do n="$(basename "$f" | cut -d- -f1)"; [[ "$n" -ge 27 ]] && echo "$f"; done)
            else
              echo "Missing package safety pass: scripts/19-fix-nexos-package-lists.sh" | tee -a build/logs/github-actions-source-preflight.log
              wiring_failed=1
            fi
            echo "syntax_failed=$syntax_failed wiring_failed=$wiring_failed" | tee -a build/logs/github-actions-source-preflight.log
            [[ "$syntax_failed" = "0" && "$wiring_failed" = "0" ]]
          '
          code=$?
          echo "$code" > build/logs/github-actions-source-preflight-exit-code.txt
          exit 0

      - name: Build ISO inside Debian Trixie container
        run: |
          mkdir -p build/logs iso
          EDITION="${{ github.event.inputs.edition || 'main' }}"
          preflight_code="$(cat build/logs/github-actions-source-preflight-exit-code.txt 2>/dev/null || echo 1)"
          if [[ "$preflight_code" != "0" ]]; then
            echo "Source preflight failed with exit code $preflight_code. Skipping ISO build." | tee build/logs/github-actions-build-skipped.log
            echo "$preflight_code" > build/logs/github-actions-exit-code.txt
            exit 0
          fi
          set +e
          docker run --privileged --rm -v "$PWD:/work" -w /work -e DEBIAN_FRONTEND=noninteractive -e NEXOS_EDITION="$EDITION" debian:trixie bash -lc '
            set -Euo pipefail
            mkdir -p build/logs iso
            : > build/logs/github-actions-preflight.log
            apt-get update 2>&1 | tee -a build/logs/github-actions-preflight.log
            apt-get install -y --no-install-recommends bash ca-certificates coreutils curl file findutils git grep gzip live-build debootstrap squashfs-tools xorriso make sed tar util-linux sudo 2>&1 | tee -a build/logs/github-actions-preflight.log
            install_optional_runner_pkg(){ local pkg="$1"; if apt-cache show "$pkg" >/dev/null 2>&1; then apt-get install -y --no-install-recommends "$pkg" 2>&1 | tee -a build/logs/github-actions-preflight.log || true; else echo "Optional runner package not available: $pkg" | tee -a build/logs/github-actions-preflight.log; fi; }
            for pkg in isolinux syslinux-common syslinux-utils mtools parted rsync dosfstools shellcheck jq python3-yaml; do install_optional_runner_pkg "$pkg"; done
            command -v lb >/dev/null 2>&1 || { echo "ERROR: live-build command lb was not installed." | tee -a build/logs/github-actions-preflight.log; exit 2; }
            find scripts -type f -name "*.sh" -exec chmod +x {} +
            [[ ! -d testing ]] || find testing -type f -name "*.sh" -exec chmod +x {} +
            syntax_failed=0
            while IFS= read -r script; do bash -n "$script" 2>&1 | tee -a build/logs/github-actions-preflight.log || syntax_failed=1; done < <(find scripts -type f -name "*.sh" | sort)
            echo "syntax_failed=$syntax_failed" | tee -a build/logs/github-actions-preflight.log
            [[ "$syntax_failed" = "0" ]] || exit 13

            if [[ -f scripts/02-init-live-build.sh ]]; then bash scripts/02-init-live-build.sh 2>&1 | tee build/logs/github-actions-init-live-build.log || true; fi
            if [[ -f scripts/19-fix-nexos-package-lists.sh ]]; then bash scripts/19-fix-nexos-package-lists.sh 2>&1 | tee build/logs/github-actions-package-safety.log || true; fi
            CFG="live-build/config"

            validation="build/logs/nexos-build-validation-report.txt"
            {
              echo "NexOS Build Validation Report"; echo "============================="; date; echo; echo "Edition: $NEXOS_EDITION"; echo
              echo "Late injectors wired in safety pass:"; grep -E "^[[:space:]]+[0-9]+-inject-nexos-.*\.sh" scripts/19-fix-nexos-package-lists.sh | sed "s/^[[:space:]]*/- /" || true; echo
              echo "Injector files present:"; find scripts -maxdepth 1 -type f -name "*-inject-nexos-*.sh" -printf "- %f\n" | sort -V || true; echo
              echo "Generated package lists after safety pass:"; find "$CFG/package-lists" -maxdepth 1 -type f -name "*.list.chroot" -printf "- %f\n" 2>/dev/null | sort || true; echo
              echo "Optional packages moved out of hard lists:"; if [[ -f "$CFG/nexos-removed-optional-packages.txt" ]]; then sed "s/^/- /" "$CFG/nexos-removed-optional-packages.txt"; else echo "- none recorded"; fi; echo
              echo "Generated normal hooks:"; find "$CFG/hooks/normal" -maxdepth 1 -type f -printf "- %f\n" 2>/dev/null | sort || true; echo
              echo "Expected NexOS commands from injectors:"; grep -R "cat > /usr/local/bin/nexos-" -n scripts/*inject-nexos-*.sh 2>/dev/null | sed "s/^/- /" | head -240 || true
            } | tee "$validation"

            smoke="build/logs/nexos-final-smoke-source-report.txt"
            {
              echo "NexOS Final Smoke Source Report"; echo "==============================="; date; echo
              pass=0; warn=0; fail=0
              smoke_check(){ name="$1"; shift; if "$@" >/tmp/nexos-gh-smoke.out 2>&1; then echo "PASS: $name"; pass=$((pass+1)); else echo "FAIL: $name"; sed "s/^/  /" /tmp/nexos-gh-smoke.out; fail=$((fail+1)); fi; }
              smoke_soft(){ name="$1"; shift; if "$@" >/tmp/nexos-gh-smoke.out 2>&1; then echo "PASS: $name"; pass=$((pass+1)); else echo "WARN: $name"; sed "s/^/  /" /tmp/nexos-gh-smoke.out; warn=$((warn+1)); fi; }
              smoke_check "package safety script exists" test -f scripts/19-fix-nexos-package-lists.sh
              for n in 56 57 58 59 60 61; do smoke_check "injector $n exists" bash -lc "ls scripts/${n}-inject-nexos-*.sh >/dev/null 2>&1"; done
              smoke_soft "live-build package lists generated" bash -lc "find live-build/config/package-lists -maxdepth 1 -name \"*.list.chroot\" | grep -q ."
              smoke_soft "live-build hooks generated" bash -lc "find live-build/config/hooks/normal -maxdepth 1 -type f | grep -q ."
              echo; echo "Summary: PASS=$pass WARN=$warn FAIL=$fail"
              rm -f /tmp/nexos-gh-smoke.out
            } | tee "$smoke"

            readiness="build/logs/nexos-release-readiness-source-report.txt"
            {
              echo "NexOS Release Readiness Source Report"; echo "===================================="; date; echo; echo "Edition: $NEXOS_EDITION"; echo
              echo "Source preflight exit code: $(cat build/logs/github-actions-source-preflight-exit-code.txt 2>/dev/null || echo unknown)"
              echo "Package safety log: $([[ -s build/logs/github-actions-package-safety.log ]] && echo present || echo missing)"
              echo "Build validation report: $([[ -s build/logs/nexos-build-validation-report.txt ]] && echo present || echo missing)"
              echo "Release readiness verdict: READY FOR ISO BUILD ATTEMPT - live-build result below is the source of truth."
            } | tee "$readiness"

            audit="build/logs/nexos-final-source-build-audit-report.txt"
            {
              echo "NexOS Final Source Build Audit Report"; echo "===================================="; date; echo
              echo "Workflow file exists: $([[ -f .github/workflows/build-nexos-iso.yml ]] && echo yes || echo no)"
              echo "All scripts bash -n checked before build."
              echo "All late injector wiring checked before build."
            } | tee "$audit"

            notes="build/logs/nexos-release-notes.md"
            {
              echo "# NexOS ISO Release Notes"; echo; echo "Generated: $(date)"; echo; echo "Edition: $NEXOS_EDITION"; echo
              echo "## Included source features"; find scripts -maxdepth 1 -type f -name "*-inject-nexos-*.sh" -printf "- %f\n" | sort -V || true; echo
              echo "## Build reports included in this artifact"; printf -- "- nexos-build-validation-report.txt\n- nexos-final-smoke-source-report.txt\n- nexos-release-readiness-source-report.txt\n- nexos-final-source-build-audit-report.txt\n- github-actions-package-safety.log\n"
            } | tee "$notes"

            set -e
            if [[ "$NEXOS_EDITION" == "all" ]]; then
              make iso-main 2>&1 | tee build/logs/github-actions-main-iso.log
              make validate-iso-main 2>&1 | tee build/logs/github-actions-main-validate.log
              make clean 2>&1 | tee build/logs/github-actions-clean-after-main.log || true
              make iso-tools 2>&1 | tee build/logs/github-actions-tools-iso.log
              make validate-iso-tools 2>&1 | tee build/logs/github-actions-tools-validate.log
              make clean 2>&1 | tee build/logs/github-actions-clean-after-tools.log || true
              make iso-security 2>&1 | tee build/logs/github-actions-security-iso.log
              make validate-iso-security 2>&1 | tee build/logs/github-actions-security-validate.log
            elif [[ "$NEXOS_EDITION" == "tools" ]]; then
              make iso-tools 2>&1 | tee build/logs/github-actions-tools-iso.log
              make validate-iso-tools 2>&1 | tee build/logs/github-actions-tools-validate.log
            elif [[ "$NEXOS_EDITION" == "security" ]]; then
              make iso-security 2>&1 | tee build/logs/github-actions-security-iso.log
              make validate-iso-security 2>&1 | tee build/logs/github-actions-security-validate.log
            else
              make iso-main 2>&1 | tee build/logs/github-actions-main-iso.log
              make validate-iso-main 2>&1 | tee build/logs/github-actions-main-validate.log
            fi
            ls -lh iso
          '
          code=$?
          echo "$code" > build/logs/github-actions-exit-code.txt
          exit 0

      - name: Print NexOS build error summary
        if: always()
        run: |
          mkdir -p build/logs
          code="0"
          if [[ -f build/logs/github-actions-exit-code.txt ]]; then code="$(cat build/logs/github-actions-exit-code.txt)"; elif [[ -f build/logs/github-actions-source-preflight-exit-code.txt ]]; then code="$(cat build/logs/github-actions-source-preflight-exit-code.txt)"; fi
          echo "## NexOS ISO build diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Available logs" >> "$GITHUB_STEP_SUMMARY"
          find build/logs -maxdepth 1 -type f -printf '- %f\n' 2>/dev/null | sort >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for pair in \
            "Build validation report preview|build/logs/nexos-build-validation-report.txt|120" \
            "Final smoke source report preview|build/logs/nexos-final-smoke-source-report.txt|100" \
            "Release readiness source report preview|build/logs/nexos-release-readiness-source-report.txt|80" \
            "Final source build audit preview|build/logs/nexos-final-source-build-audit-report.txt|80" \
            "Release notes preview|build/logs/nexos-release-notes.md|120"; do
            title="${pair%%|*}"; rest="${pair#*|}"; file="${rest%%|*}"; lines="${rest##*|}"
            [[ -f "$file" ]] || continue
            echo "### $title" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            head -n "$lines" "$file" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done
          combined="build/logs/github-actions-combined-tail.log"
          : > "$combined"
          for f in build/logs/*.log; do [[ -f "$f" ]] || continue; echo "===== $f =====" >> "$combined"; tail -n 260 "$f" >> "$combined" || true; echo >> "$combined"; done
          first_error="$(grep -iE 'E: |ERROR:|Failed|failed|unable to locate|not found|syntax error|no such file|conflict|dpkg returned|apt-get|lb build|SOURCE AUDIT FAILED|NOT READY' "$combined" | grep -vi 'Optional runner package not available' | head -n 1 || true)"
          [[ -n "$first_error" ]] || first_error="No obvious error marker found. Check build/logs artifact."
          echo "### First detected error" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$first_error" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Live-build failure tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          for f in build/logs/github-actions-*-iso.log build/logs/live-build-*.log; do [[ -f "$f" ]] && { echo "===== $f ====="; tail -n 180 "$f"; }; done >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$code" != "0" ]]; then echo "::error title=NexOS ISO build failed::$first_error"; exit "$code"; fi

      - name: Show runner disk space after build
        if: always()
        run: df -h

      - name: Upload NexOS ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexOS-live-ISO
          path: |
            iso/*.iso
            iso/*.sha256
            build/logs/**
          if-no-files-found: warn
          retention-days: 14
